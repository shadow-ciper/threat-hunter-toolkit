title: Suspicious LSASS Memory Access
id: 6f3d2b1a-9c44-4e21-b8a0-1d7e5c3f9a20
status: experimental
description: Detects a process opening LSASS with read access, which is a common credential dumping step.
author: shadow-ciper
level: high
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4656
        TargetObject|contains: '\\lsass.exe'
        AccessMask|contains: '0x1010'
    filter:
        SourceImage|contains:
            - '\\w3wp.exe'
            - '\\sqlservr.exe'
    condition: selection and not filter
false_positives:
    - Approved credential scanning by endpoint tooling
tags:
    - attack.credential-access
    - attack.t1003.001
